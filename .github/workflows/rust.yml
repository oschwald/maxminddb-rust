name: Rust

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs for the same pull request. Other events get a
# unique group so they never cancel each other.
concurrency:
  group: rust-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta, nightly]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install ${{ matrix.toolchain }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Run cargo check
        run: cargo check --features mmap

  test:
    name: Test Suite
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta, nightly]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install ${{ matrix.toolchain }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Run cargo test
        run: cargo test

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep in sync with rust-version in Cargo.toml.
      - name: Install 1.77 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.77"

      - name: Check library
        run: cargo check --lib

      - name: Check library with all features
        run: cargo check --lib --all-features

  feature-test:
    name: Feature Tests
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - platform: ubuntu-latest
            features: mmap
          - platform: ubuntu-latest
            features: unsafe-str-decode
          - platform: ubuntu-latest
            features: mmap,unsafe-str-decode
          - platform: ubuntu-latest
            features: mmap,unsafe-str-decode,fuzzing
          - platform: macos-latest
            features: mmap
          - platform: windows-latest
            features: mmap
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run feature tests
        run: cargo test --features "${{ matrix.features }}"

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      # unsafe-str-decode replaces the default string decoding and fuzzing
      # adds entry points, so lint the usual build and every feature.
      - name: Run cargo clippy
        run: cargo clippy --all-targets --features mmap -- -D warnings

      - name: Run cargo clippy with all features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test release helpers
        run: bash dev-bin/release-lib-test.sh
