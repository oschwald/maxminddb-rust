name: Fuzz

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    # Scheduled runs fuzz each target for 5 minutes, then minimize the corpus.
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # The key is unique per run, so each saved corpus is a new entry and
      # the next run restores the most recent one through restore-keys.
      # Pull requests and failed runs restore the corpus but do not save it.
      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-

      - name: Fuzz standalone values
        run: >-
          cargo fuzz run decode --
          -max_total_time=${{ github.event_name == 'schedule' && '300' || '30' }}
          -max_len=4096
          -timeout=5

      - name: Fuzz reader operations
        run: >-
          cargo fuzz run reader --
          -max_total_time=${{ github.event_name == 'schedule' && '300' || '30' }}
          -max_len=32768
          -timeout=5

      # Drop inputs that add no coverage so the saved corpus stays small.
      - name: Minimize fuzz corpus
        if: ${{ success() && github.event_name != 'pull_request' }}
        run: |
          cargo fuzz cmin decode -- -max_len=4096 -timeout=5
          cargo fuzz cmin reader -- -max_len=32768 -timeout=5

      - name: Save fuzz corpus
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}

      # cancelled() covers a run stopped by timeout-minutes.
      - name: Upload crashing inputs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ github.run_attempt }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
